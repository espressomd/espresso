name: run tests

on:
  push:
  pull_request:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  macos:
    runs-on: macos-15
    if: ${{ github.repository == 'espressomd/espresso' }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos
          save: ${{ github.ref == 'refs/heads/python' }}
      - name: Get runner specifications
        run: system_profiler SPHardwareDataType
      - name: Install dependencies
        run: |
         echo '' > Brewfile
         for dep in boost boost-mpi fftw gsl ccache ninja; do echo "brew \"${dep}\"" >> Brewfile; done
         brew bundle check >/dev/null 2>&1 || brew bundle --verbose --no-upgrade
         # set up Xcode compiler
         echo "::group::List available Xcode compilers"
         ls /Applications | grep Xcode
         echo "::endgroup::"
         sudo xcode-select -switch /Applications/Xcode_16.4.app
         echo "::group::Install OpenMP (https://mac.r-project.org/openmp/)"
         curl -s -o ${{ runner.temp }}/openmp.tar.gz https://mac.r-project.org/openmp/openmp-19.1.0-darwin20-Release.tar.gz
         sudo tar fvxz ${{ runner.temp }}/openmp.tar.gz -C /
         rm ${{ runner.temp }}/openmp.tar.gz
         codesign -d -vv /usr/local/lib/libomp.dylib
         echo "::endgroup::"
         # Python dependencies
         python -m venv venv
         . venv/bin/activate
         python -m pip install -c requirements.txt cython numpy scipy packaging
         deactivate
        shell: bash
      - name: Build and check
        uses: ./.github/actions/build_and_check
        env:
          build_procs: 3
          check_procs: 3
          cmake_params: '-D ESPRESSO_TEST_NP=3'
          with_ccache: 'true'
          with_fftw: 'true'
          with_gsl: 'true'
          with_walberla: 'true'
          with_walberla_avx: 'false'
          with_shared_memory_parallelism: 'false'

  debian:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/espressomd/docker/debian:3388b293a5e8a9b613b1bfa4220e54dfb4bff245-base-layer
      credentials:
         username: ${{ github.actor }}
         password: ${{ secrets.github_token }}
      options: --cpus 4
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: debian
          save: ${{ github.ref == 'refs/heads/python' || ( github.repository != 'espressomd/espresso' && ! startsWith(github.ref, 'refs/pull') ) }}
      - name: Setup Git environment
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Get runner specifications
        run: lscpu | egrep 'Model name|Socket|Thread|NUMA|CPU\(s\)'
      - name: Build and check
        uses: ./.github/actions/build_and_check
        env:
          build_procs: 4
          check_procs: 4
          CC: 'gcc-14'
          CXX: 'g++-14'
          myconfig: 'maxset'
          with_ccache: 'true'
          with_cuda: 'false'
          with_hdf5: 'true'
          with_fftw: 'true'
          with_gsl: 'false'
          with_scafacos: 'false'
          with_stokesian_dynamics: 'false'
          with_shared_memory_parallelism: 'false'
          make_check_unit_tests: 'true'
          make_check_python: 'false'
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

  ubuntu:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'espressomd/espresso' }}
    container:
      image: ghcr.io/espressomd/docker/ubuntu-wo-dependencies:3388b293a5e8a9b613b1bfa4220e54dfb4bff245-base-layer
      credentials:
         username: ${{ github.actor }}
         password: ${{ secrets.github_token }}
      options: --cpus 4
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu
          save: ${{ github.ref == 'refs/heads/python' }}
      - name: Setup Git environment
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Get runner specifications
        run: lscpu | egrep 'Model name|Socket|Thread|NUMA|CPU\(s\)'
      - name: Build and check
        uses: ./.github/actions/build_and_check
        env:
          build_procs: 4
          check_procs: 4
          CC: 'gcc-13'
          CXX: 'g++-13'
          myconfig: 'maxset'
          with_ccache: 'true'
          with_cuda: 'false'
          with_hdf5: 'false'
          with_fftw: 'false'
          with_gsl: 'false'
          with_scafacos: 'false'
          with_stokesian_dynamics: 'false'
          with_shared_memory_parallelism: 'false'
          make_check_unit_tests: 'false'
          make_check_python: 'false'
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

  fedora:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'espressomd/espresso' }}
    container:
      image: ghcr.io/espressomd/docker/fedora:3388b293a5e8a9b613b1bfa4220e54dfb4bff245-base-layer
      credentials:
         username: ${{ github.actor }}
         password: ${{ secrets.github_token }}
      options: --cpus 4
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: fedora
          save: ${{ github.ref == 'refs/heads/python' || ( github.repository != 'espressomd/espresso' && ! startsWith(github.ref, 'refs/pull') ) }}
      - name: Setup Git environment
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Get runner specifications
        run: lscpu | egrep 'Model name|Socket|Thread|NUMA|CPU\(s\)'
      - name: Build and check
        uses: ./.github/actions/build_and_check
        env:
          build_procs: 4
          check_procs: 4
          CC: 'gcc'
          CXX: 'g++'
          myconfig: 'maxset'
          with_ccache: 'true'
          with_cuda: 'false'
          with_hdf5: 'true'
          with_fftw: 'true'
          with_fpe: 'true'
          with_gsl: 'false'
          with_scafacos: 'false'
          with_walberla: 'true'
          with_walberla_avx: 'false'
          with_stokesian_dynamics: 'true'
          with_shared_memory_parallelism: 'false'
          cmake_params: '-D CMAKE_CXX_STANDARD=23 -D CMAKE_INCLUDE_PATH=/usr/include/mpich-x86_64 -D CMAKE_PREFIX_PATH=/usr/lib64/mpich/lib/'
